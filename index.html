
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChatLoga</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#101820;
 color:#fff;
 font-family:Tahoma,Arial,sans-serif;
}
header{
 height:60px;
 background:#182431;
 border-bottom:1px solid #293746;
 display:flex;
 align-items:center;
 padding:0 17px;
 font-size:19px;
 font-weight:bold;
 color:#55dca0;
}
#messages{
 max-width:850px;
 margin:auto;
 padding:12px 15px 25px;
}
.message{
 padding:13px 5px;
 border-bottom:1px solid #283644;
}
.message-text{
 font-size:14px;
 line-height:1.9;
 white-space:pre-wrap;
 overflow-wrap:anywhere;
}
.time{
 color:#8499ad;
 font-size:10px;
 margin-top:5px;
}
#status{
 text-align:center;
 padding:15px;
 color:#8fa4b8;
 font-size:12px;
}
</style>
</head>

<body>

<header>ChatLoga</header>

<div id="status">در حال اتصال...</div>
<div id="messages"></div>

<script>

const PROJECT = "https://ihbsxjgzrhnssluqooqh.supabase.co";
const API_KEY = "sb_publishable_hHyHJI5JkxgLNrXAwZrGWQ_vbD3kdrj";

const API =
"https://" + PROJECT +
".supabase.co/rest/v1/rpc/chatlogs_read";

async function loadMessages(){

 try{

  const response = await fetch(API,{
   method:"POST",
   headers:{
    "apikey":API_KEY,
    "Authorization":"Bearer "+API_KEY,
    "Content-Type":"application/json"
   },
   body:"{}"
  });

  if(!response.ok){
   throw new Error("Connection failed");
  }

  const data = await response.json();

  const box = document.getElementById("messages");

  const status = document.getElementById("status");

  status.textContent = data.length
   ? "ChatLoga"
   : "هنوز پیامی ارسال نشده است";

  box.innerHTML = data.map(item=>{

   const time = new Date(item.created_at);

   return `
    <div class="message">

     <div class="message-text">${escapeHTML(item.message)}</div>

     <div class="time">
      ${escapeHTML(time.toLocaleDateString("fa-IR"))}
      ·
      ${escapeHTML(time.toLocaleTimeString("fa-IR"))}
     </div>

    </div>
   `;

  }).join("");

 }catch(error){

  document.getElementById("status")
   .textContent="خطا در اتصال به سرور";

 }

}

function escapeHTML(text){

 return String(text??"").replace(
  /[&<>"']/g,
  c=>({
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#39;"
  })[c]
 );

}

loadMessages();

// بروزرسانی خودکار هر 3 ثانیه
setInterval(loadMessages,3000);

</script>

</body>
</html>
