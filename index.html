
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChatLoga</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#0b1018;
 color:#e7edf5;
 font-family:Tahoma,Arial,sans-serif;
}

header{
 background:#151d28;
 border-bottom:1px solid #303b49;
 padding:18px;
 font-size:21px;
 font-weight:bold;
 color:#52d99c;
}

main{
 max-width:900px;
 margin:auto;
 padding:18px;
}

h3{
 font-size:16px;
 margin:15px 0;
}

input{
 width:100%;
 padding:12px;
 margin:8px 0;
 background:#111b28;
 border:1px solid #35465a;
 border-radius:5px;
 color:white;
 font-size:14px;
}

button{
 background:#238c63;
 border:0;
 padding:11px 17px;
 color:white;
 border-radius:5px;
 font-size:14px;
 cursor:pointer;
}

.toolbar{
 display:flex;
 gap:10px;
 flex-wrap:wrap;
 margin:15px 0;
}

.toolbar input{
 flex:1;
 min-width:150px;
}

.log{
 padding:15px 3px;
 border-bottom:1px solid #293544;
}

.meta{
 color:#8fa5bd;
 font-size:11px;
 line-height:2;
}

.player{
 color:#5bdfa4;
 font-size:15px;
 font-weight:bold;
 margin:7px 0;
}

.site{
 color:#80b9ff;
 font-size:12px;
 direction:ltr;
 text-align:left;
 overflow-wrap:anywhere;
 margin:7px 0;
}

.data{
 background:#101a27;
 padding:10px;
 direction:ltr;
 text-align:left;
 white-space:pre-wrap;
 overflow-wrap:anywhere;
 font-size:12px;
 line-height:1.8;
 color:#d5e2f0;
 border-radius:4px;
}

.hidden{display:none}

#error{
 color:#ff7688;
 font-size:12px;
 margin-top:10px;
}

#logs{
 margin-top:15px;
}

.empty{
 text-align:center;
 color:#8b9bad;
 padding:35px 5px;
}

</style>
</head>

<body>

<header>ChatLoga</header>

<main>

<section id="login">

<h3>ورود مدیریت</h3>

<input
 id="password"
 type="password"
 placeholder="رمز مدیریت"
>

<button onclick="login()">ورود</button>

<div id="error"></div>

</section>

<section id="content" class="hidden">

<h3>ChatLoga</h3>

<div class="toolbar">

<input
 id="search"
 placeholder="جستجو..."
 oninput="render()"
>

<button onclick="loadLogs()">بروزرسانی</button>

<button onclick="logout()">خروج</button>

</div>

<div id="logs"></div>

</section>

</main>

<script>

const PROJECT = "YOUR_PROJECT_REF";

const API_KEY = "YOUR_SUPABASE_PUBLISHABLE_KEY";

const API =
"https://" + PROJECT +
".supabase.co/rest/v1/rpc/";

let password = "";
let entries = [];

async function rpc(name,body){

 const response = await fetch(API + name,{
  method:"POST",

  headers:{
   "Content-Type":"application/json",
   "apikey":API_KEY,
   "Authorization":"Bearer "+API_KEY
  },

  body:JSON.stringify(body)
 });

 const result = await response.json();

 if(!response.ok){
  throw new Error(
   result.message || "Connection error"
  );
 }

 return result;
}

async function login(){

 password =
 document.getElementById("password").value;

 try{

  await loadLogs();

  document.getElementById("login")
   .classList.add("hidden");

  document.getElementById("content")
   .classList.remove("hidden");

 }catch(e){

  document.getElementById("error")
   .textContent="رمز اشتباه یا خطای اتصال";

  password="";

 }

}

async function loadLogs(){

 const result = await rpc("lac_list",{
  p_password:password
 });

 entries=result.items||[];

 render();

}

function escapeHTML(value){

 return String(value??"").replace(
  /[&<>"']/g,
  c=>({
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#39;"
  })[c]
 );

}

function render(){

 const query =
 document.getElementById("search")
 .value.toLowerCase();

 const filtered=entries.filter(x=>
  JSON.stringify(x).toLowerCase()
  .includes(query)
 );

 const box=document.getElementById("logs");

 if(!filtered.length){

  box.innerHTML=
  '<div class="empty">موردی وجود ندارد</div>';

  return;
 }

 box.innerHTML=filtered.map(x=>{

  const date=new Date(x.created_at);

  return `

   <div class="log">

    <div class="meta">
     #${escapeHTML(x.id)}
     · ${escapeHTML(date.toLocaleDateString("fa-IR"))}
     · ${escapeHTML(date.toLocaleTimeString("fa-IR"))}
    </div>

    <div class="player">
     ${escapeHTML(x.player_name||"Unknown")}
    </div>

    <div class="site">
     ${escapeHTML(x.site||"No site provided")}
    </div>

    <pre class="data">${escapeHTML(
     JSON.stringify(x.details,null,2)
    )}</pre>

   </div>

  `;

 }).join("");

}

function logout(){

 password="";
 entries=[];

 document.getElementById("content")
 .classList.add("hidden");

 document.getElementById("login")
 .classList.remove("hidden");

 document.getElementById("password").value="";

}

document.getElementById("password")
.addEventListener("keydown",e=>{
 if(e.key==="Enter")login();
});

</script>

</body>
</html>
